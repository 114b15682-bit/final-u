<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Dimension Portal</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>

<body>

<!-- 🌌 Landing -->
<div id="landing">
  <h1>DREAM PORTAL</h1>
  <p>Enter the Dream Dimension</p>

  <button id="startBtn">ENTER</button>
</div>

<!-- 📖 HUD 說明 -->
<div id="hud">
  <div class="box">
    <h2>Controls</h2>

    <p>🖱 Move Mouse → Distort Portal</p>
    <p>👆 Click → Create Rift</p>
    <p>⌨ Space → Change Dimension</p>
    <p>⌨ B → Black Hole Mode</p>
    <p>⌨ S → Save Image</p>

    <p class="hint">Click to hide</p>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
